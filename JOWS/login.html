<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#2b2b2b,#3a3a3a);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* 全体 */
.wrapper{
  width:1100px;
  display:flex;
  gap:60px;
}

/* 左 */
.loginBox{
  flex:1;
}

/* 入力カード */
.card{
  background:#eee;
  border-radius:30px;
  padding:40px;
  box-shadow:0 10px 30px rgba(255,0,0,0.2);
}

/* 入力 */
.inputRow{
  display:flex;
  margin-bottom:20px;
}

.label{
  width:100px;
  background:#333;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px 0 0 15px;
}

.input{
  flex:1;
  border:none;
  padding:15px;
  background:#ccc;
  border-radius:0 15px 15px 0;
  font-size:16px;
}

/* チェック */
.remember{
  margin-top:15px;
  font-size:14px;
}

/* ログインボタン */
.loginBtn{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:25px;
  background:#ddd;
  font-size:18px;
  cursor:pointer;
}

/* 右 */
.updateBox{
  flex:1;
  background:#777;
  padding:30px;
  border-radius:30px;
}

.updateTitle{
  background:#eee;
  padding:10px 20px;
  border-radius:20px;
  display:inline-block;
  margin-bottom:20px;
}

.updateContent{
  background:#eee;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 20px rgba(255,0,0,0.2);
}

/* 下 */
.footer{
  position:absolute;
  bottom:30px;
  color:white;
  font-size:22px;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- 左 -->
  <div class="loginBox">
    <div class="card">

      <div class="inputRow">
        <div class="label">ID</div>
        <input id="id" class="input">
      </div>

      <div class="inputRow">
        <div class="label">Pass</div>
        <input id="pass" type="password" class="input">
      </div>

      <div class="remember">
        <input type="checkbox" id="remember">
        この端末を記憶する。
      </div>

    </div>

    <button class="loginBtn" onclick="login()">ログイン</button>
  </div>

  <!-- 右 -->
  <div class="updateBox">
    <div class="updateTitle">Ver 1.1 Update</div>

    <div class="updateContent">
      ・保存機能追加<br>
      ・事前の入力を保持する<br>
      ・攻守交代を実装(オプションモードのみ)<br>
      ・攻守付きUI時のチーム名、ロゴ、マップカウントの位置調整<br>
      ・ログイン機能を実装(ベータ版はID PASS統一)<br>
      <br>
    </div>
  </div>

</div>

<div class="footer">
  JOWS 配信UI管理画面 β版
</div>

<script>

// 🔑 ログイン処理
function login(){
  const id = document.getElementById("id").value;
  const pass = document.getElementById("pass").value;
  const remember = document.getElementById("remember").checked;

  if(id === "admin" && pass === "JOWS"){

    // 🔐 今ログインしてる状態
    localStorage.setItem("login","true");

    // 💾 端末記憶
    if(remember){
      localStorage.setItem("jows_login","true");
    }else{
      localStorage.removeItem("jows_login");
    }

    location.href = "control.html";

  }else{
    alert("IDまたはパスワードが違います");
  }
}


// 🔁 自動ログイン
window.onload = ()=>{
  if(localStorage.getItem("jows_login") === "true"){
    localStorage.setItem("login","true"); // ←ここ重要（セッション復元）
    location.href = "control.html";
  }
};

</script>
</body>
</html>
